name: Release

# Build the Windows tray app as a zip and a standalone portable .exe, together
# with the CLI it drives, and publish both as GitHub Release assets. Trigger by
# pushing a version tag:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# `workflow_dispatch` is there so a build can be re-run manually and publish
# an explicitly selected tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build CLI
        run: |
          npm ci
          npm run build
      - name: Install tray app
        run: npm ci
        working-directory: windows
      - name: Package zip (checkout-style, includes the CLI)
        shell: pwsh
        run: |
          Compress-Archive -Path dist, node_modules, package.json, windows `
            -DestinationPath ilias-sync-windows.zip
      - uses: actions/upload-artifact@v5
        with:
          name: ilias-sync-windows
          path: ilias-sync-windows.zip
      - name: Package portable exe (tray app)
        working-directory: windows
        run: npm run package
      - name: Rename exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path windows/release-build -Filter *.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName "ILIAS Sync.exe"
      - uses: actions/upload-artifact@v5
        with:
          name: ilias-sync-windows-exe
          path: "ILIAS Sync.exe"

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            artifacts/ilias-sync-windows.zip
            artifacts/ILIAS Sync.exe
          generate_release_notes: true
