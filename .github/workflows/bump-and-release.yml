name: Bump and release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Optional explicit version without the v prefix (for example 1.2.0)
        required: false
        type: string

permissions:
  actions: write
  contents: write

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate and validate version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          current=$(node -p "require('./package.json').version")
          windows_current=$(node -p "require('./windows/package.json').version")
          if [ "$current" != "$windows_current" ]; then
            echo "Package versions differ: root=$current windows=$windows_current" >&2
            exit 1
          fi

          if [ -n "$EXPLICIT_VERSION" ]; then
            next="$EXPLICIT_VERSION"
          else
            IFS=. read -r major minor patch <<EOF
          $current
          EOF
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
              *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
            esac
          fi

          if [[ ! "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH format: $next" >&2
            exit 1
          fi
          if git rev-parse "refs/tags/v$next" >/dev/null 2>&1; then
            echo "Tag v$next already exists." >&2
            exit 1
          fi

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Bumping $current to $next"

      - name: Update package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version
          npm --prefix windows version "$VERSION" --no-git-tag-version

      - name: Commit version and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json windows/package.json windows/package-lock.json
          git commit -m "chore: bump version to v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
          gh workflow run release.yml --ref "v$VERSION" -f tag="v$VERSION"
